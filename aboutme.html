<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            /* Note: I want each section to be in its own bubble and own bubble shadow */
            @font-face {
                font-family: "Magica";
                src: url(https://static.tumblr.com/p6yopnt/Qkiqnu0r5/theheart.ttf);
            }
            :root {
                --dark_purple: #1e1d32; /* global scope */
                --light_purple: #2d2c41;
                --dark_blue: #b5bbd9;
                --medium_blue: #cbccfe;
                --light_blue: #ddffff;
                --brown: #fef9f6;
                color: pink;
                font-family: "magica";
                /* font-size: 1.125em; */
                font-size: 1.2em;
            }
            a {
                text-decoration: none;
                color: pink;
            }
            a:hover {
                font-weight: bold;
            }
            /* a:hover::before {
                content: "「";
                display: inline;
            }
            a:hover::after {
                content: "」";
                display: inline;
            } */
            body {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px 40px;
                display: block;
                font-size: 1.125em;
                background-image: url(PillsAndBandaidsAltGrey.png);
                background-color: rgb(37, 204, 15);
                background-attachment: fixed;
                background-position: center;
                text-align: center;
            }
            #island {
                border-radius: 25px;
                /* box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5); */
                /* background-color: pink; */
                /* border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                overflow: hidden; */
                /* padding: 6px; */

            }
            header {
                background-image: url("bg_top.gif");
                background-color: var(--dark_purple);
                background-size: 103%;
                background-position: center;
                background-repeat: no-repeat;
                height: 200px;
                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                overflow: hidden;
                box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5);

            }
            #header-image {
                height: 200%;
                /* width: 100%; */
                translate: 0 -25%;
                object-fit: fill;
            }
            #grid {
                /* height: 2000px; */
                /* padding: 10px 0 10px 0; */
                /* background-color: var(--dark_purple); */
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 6px;
                padding: 6px 0 6px 0;
            }
            #nav {
                order: 1;
                /* flex-grow: 1; */
                flex-basis: 20%;
                background-color: var(--dark_purple);
                /* height: 40px; */
                /* text-align: left; */

                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5);
                overflow: hidden;


            }
            .section-title {
                background-color: rgb(167, 25, 75);
                line-height: 1.5em;
                /* text-align: center; */
            }
            .section {
                background-color: var(--light_purple);
                border-top: solid;
                border-color: var(--dark_blue);
                border-width: 3px;
            }
            #content {
                order: 2;
                flex-grow: 2;
                background-color: var(--dark_purple);
                /* height: 400px; */

                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5);
                overflow: hidden;

            }
            #updates {
                order: 3;
                /* flex-grow: 1; */
                flex-basis: 20%;
                background-color: var(--dark_purple);
                /* height: 40px; */

                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5);
                overflow: hidden;



            }
            footer {
                background-color: var(--light_purple);
                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                overflow: hidden;
                min-height: 30px;
                box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5);
                position: relative;
                z-index: 10; /* Kinda don't like this method */
            }
            @media screen and (max-width: 768px) {
                #grid {
                    background-color: maroon;
                    flex-direction: column;
                }
                #content {
                    order: 4;
                    flex-grow: 2;
                    background-color: orange;
                }
                .section {
                    display:none;
                }
            }
        </style>
    </head>
    <body>
        <div id="island">
            <header>
                <!-- Header -->
                <img id="header-image" src="BlankVersaLogoTrans.png" alt="header image">
            </header>
            <main id="grid">
                <nav id="nav">
                    <div class="section-title">
                        ≡ Nav
                    </div>
                    <div class="section">
                        ~Personal~
                    </div>
                    <a href="/aboutme">
                        <div class="subsection"> About Me </div>
                    </a>
                    <div class="subsection">
                        Friends
                    </div>
                    <div class="subsection">
                        Useful Sites
                    </div>
                    <div class="section">
                        ~Blog~
                    </div>
                    <div class="subsection">
                        Anime
                    </div>
                    <div class="subsection">
                        Content Creators
                    </div>
                    <div class="subsection">
                        Projects
                    </div>
                </nav>
                <section id="content">
                    <div class="section-title">
                        🖹 Content
                    </div>
                </section>
                <section id="updates">
                    <div class="section-title">
                        🗘 Updates
                        <!-- Note: Will be filled using JS  -->
                    </div>
                    <div class="section">
                        <div class="date">✎ 10/2/25</div>
                        <div class="content"> Launched site ♡ </div>
                    </div>
                    
                </section>
            </main>
            <footer>
                 © BlankVersa 2025 ♥ Self-coded ♥♡ Sitemap 
            </footer>
        </div>
    </body>
</html>
