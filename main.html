<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            @font-face {
                font-family: "Magica";
                src: url(https://static.tumblr.com/p6yopnt/Qkiqnu0r5/theheart.ttf);
            }
            :root {
                --dark_purple: #1e1d32; /* global scope */
                --light_purple: #2d2c41;
                --dark_blue: #b5bbd9;
                --medium_blue: #cbccfe;
                --light_blue: #ddffff;
                --brown: #fef9f6;
                color: pink;
                font-family: "magica";
                font-size: 1.125em;
            }

            body {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px 40px;
                display: block;
                font-size: 1.125em;
                background-image: url(PillsAndBandaidsAltGrey.png);
                background-color: rgb(179, 153, 189);
                text-align: center;
            }
            #island {
                border-radius: 25px 25px;
                box-shadow: 0 10px 15px 5px rgba(114, 75, 97, 0.5);
                /* background-color: pink; */
                /* border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px;
                background-clip: border-box;
                overflow: hidden; */
                /* padding: 6px; */

            }
            header {
                background-image: url("bg_top.gif");
                background-size: 103%;
                background-position: center;
                background-repeat: no-repeat;
                height: 200px;
                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 25px 25px 0 0;
                background-clip: border-box;
                overflow: hidden;
            }
            #header-image {
                height: 200%;
                /* width: 100%; */
                translate: 0 -25%;
                object-fit: fill;
            }
            #grid {
                /* height: 2000px; */
                /* padding: 10px 0 10px 0; */
                background-color: azure;
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 3px
            }
            #nav {
                order: 1;
                flex-grow: 1;
                background-color: var(--dark_purple);
                /* height: 40px; */

                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                /* border-radius: 25px; */
                background-clip: border-box;

            }
            #content {
                order: 2;
                flex-grow: 2;
                background-color: orange;
                height: 40px;

                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                /* border-radius: 25px; */
                background-clip: border-box;
            }
            #updates {
                order: 3;
                flex-grow: 1;
                background-color: yellow;
                height: 40px;

                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                /* border-radius: 25px; */
                background-clip: border-box;

            }
            footer {
                background-color: var(--light_purple);
                border: solid;
                border-color: var(--dark_blue);
                border-width: 6px;
                border-radius: 0 0 25px 25px;
                background-clip: border-box;
                overflow: hidden;
            }
            @media screen and (max-width: 768px) {
                #grid {
                    background-color: maroon;
                    flex-direction: column;
                }
                #content {
                    order: 4;
                    flex-grow: 2;
                    background-color: orange;
                }
                .section {
                    display:none;
                }
            }
        </style>
    </head>
    <body>
        <div id="island">
            <header>
                <!-- Header -->
                <img id="header-image" src="BlankVersaLogoTrans.png" alt="header image">
            </header>
            <main id="grid">
                <nav id="nav">
                    <div class="section-title">
                        Nav
                    </div>
                    <div class="subsection">
                        Personal
                    </div>
                    <div class="section">
                        About Me
                    </div>
                    <div class="section">
                        Friends
                    </div>
                    <div class="section">
                        Useful Sites
                    </div>
                    <div class="subsection">
                        Blog
                    </div>
                    <div class="section">
                        Anime
                    </div>
                    <div class="section">
                        Content Creators
                    </div>
                    <div class="section">
                        Projects
                    </div>
                </nav>
                <section id="content">
                    Content
                </section>
                <section id="updates">
                    Updates
                </section>
            </main>
            <footer>
                © BlankVersa 2025 ♥ Self-coded ♥ Sitemap ♡
            </footer>
        </div>
    </body>
</html>
